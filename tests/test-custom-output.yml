name: Test custom output path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake cyclonedx-bom on PATH
        run: |
          mkdir -p /usr/local/bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-cyclonedx-bom.sh" /usr/local/bin/cyclonedx-bom
          chmod +x /usr/local/bin/cyclonedx-bom
          cyclonedx-bom --help

      - id: action
        uses: .
        with:
          path: ./tests/fixtures/node-project
          output: ./custom-sbom-output.xml

      - name: Assert custom-named BOM file was created
        run: |
          echo "Listing workspace root:"
          ls -la "$GITHUB_WORKSPACE/"
          if [ ! -f "$GITHUB_WORKSPACE/custom-sbom-output.xml" ]; then
            echo "FAIL: Custom BOM file custom-sbom-output.xml was not created"
            exit 1
          fi
          echo "PASS: Custom BOM file exists at expected path"

      - name: Assert BOM file is valid XML with CycloneDX schema
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/custom-sbom-output.xml")
          echo "BOM contents:"
          echo "$CONTENT"
          # Check for XML declaration or CycloneDX BOM root element
          if ! echo "$CONTENT" | grep -qiE '(<\?xml|<bom|cyclonedx)'; then
            echo "FAIL: BOM file does not appear to be valid CycloneDX XML"
            exit 1
          fi
          echo "PASS: BOM file is valid CycloneDX XML"
