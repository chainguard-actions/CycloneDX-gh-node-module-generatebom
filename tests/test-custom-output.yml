name: Test custom output path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock cyclonedx-bom
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-cyclonedx-bom.sh" /usr/local/bin/cyclonedx-bom
          chmod +x /usr/local/bin/cyclonedx-bom
          echo "Mock cyclonedx-bom installed:"
          cyclonedx-bom --help

      - name: Create output directory
        run: mkdir -p "$GITHUB_WORKSPACE/output"

      - id: action
        uses: .
        with:
          path: ./tests/fixtures/node-project
          output: ./output/sbom.xml

      - name: Assert custom output BOM file was created
        run: |
          echo "Files in output dir:"
          ls -la "$GITHUB_WORKSPACE/output/" || echo "output dir is empty or missing"
          if [ ! -f "$GITHUB_WORKSPACE/output/sbom.xml" ]; then
            echo "FAIL: output/sbom.xml was not created at custom path"
            exit 1
          fi
          echo "PASS: output/sbom.xml exists at custom path"

      - name: Assert custom output BOM contains expected content
        run: |
          BOM_CONTENT=$(cat "$GITHUB_WORKSPACE/output/sbom.xml")
          echo "BOM content:"
          echo "$BOM_CONTENT"
          if ! echo "$BOM_CONTENT" | grep -qi "cyclonedx"; then
            echo "FAIL: sbom.xml does not contain CycloneDX content"
            exit 1
          fi
          echo "PASS: sbom.xml contains CycloneDX content"
