name: Test basic BOM generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock cyclonedx-bom
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-cyclonedx-bom.sh" /usr/local/bin/cyclonedx-bom
          chmod +x /usr/local/bin/cyclonedx-bom
          echo "Mock cyclonedx-bom installed:"
          cyclonedx-bom --help

      - id: action
        uses: .
        with:
          path: ./tests/fixtures/node-project
          output: ./bom.xml

      - name: Assert BOM file was created
        run: |
          echo "Files in workspace:"
          ls -la "$GITHUB_WORKSPACE/"
          if [ ! -f "$GITHUB_WORKSPACE/bom.xml" ]; then
            echo "FAIL: bom.xml was not created"
            exit 1
          fi
          echo "PASS: bom.xml exists"

      - name: Assert BOM file contains CycloneDX content
        run: |
          BOM_CONTENT=$(cat "$GITHUB_WORKSPACE/bom.xml")
          echo "BOM content:"
          echo "$BOM_CONTENT"
          if ! echo "$BOM_CONTENT" | grep -qi "cyclonedx"; then
            echo "FAIL: bom.xml does not contain CycloneDX content"
            exit 1
          fi
          echo "PASS: bom.xml contains CycloneDX content"

      - name: Assert BOM file is valid XML
        run: |
          if ! python3 -c "import xml.etree.ElementTree as ET; ET.parse('$GITHUB_WORKSPACE/bom.xml')" 2>/dev/null; then
            echo "FAIL: bom.xml is not valid XML"
            cat "$GITHUB_WORKSPACE/bom.xml" || true
            exit 1
          fi
          echo "PASS: bom.xml is valid XML"
